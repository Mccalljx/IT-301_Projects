<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
</head>
<style>
    *{margin: 0;}
    #flex_parents{
        height: 100vh;
        display: flex;
        justify-content: space-between;
        gap: 50px;
        align-items:center

    }
   #child1{
        min-height: 100px;
   }
   #child2{
        min-height: 100px;
   }
   #child3{
        min-height: 100px;
   }
</style>
</head>
<body>
    <div id = "flex_parents">
        <img id = "child1" src="https://picsum.photos/100/100?random=1" alt="Image 1">
        <img id = "child2" src="https://picsum.photos/200/200?random=6" alt="Image 2">
        <img id = "child3" src="https://picsum.photos/100/100?random=3" alt="Image 3">
    </div>
</body>
</html>
